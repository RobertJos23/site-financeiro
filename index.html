<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site Financeiro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>if(localStorage.getItem('tema')==='dark')document.body.classList.add('dark')</script>
    <div id="loading" class="loading-overlay"><div class="spinner"></div></div>

    <header class="topbar">
        <button id="btn-menu" class="btn-menu">&#9776;</button>
        <span class="topbar-titulo">Controle Financeiro</span>
        <div class="topbar-acoes">
            <button id="btn-tema">Modo Escuro</button>
            <button class="btn-logout" id="btn-logout">Sair</button>
        </div>
    </header>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">Controle Financeiro</span>
            <button id="btn-fechar-sidebar" class="btn-fechar-sidebar">&#10005;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="pages/dashboard.html">Dashboard</a>
            <a href="pages/assistente.html">Assistente IA</a>
            <a href="index.html">Transações</a>
            <a href="pages/categorias.html">Categorias</a>
            <a href="pages/contas.html">Contas</a>
            <a href="pages/metas.html">Metas</a>
            <a href="pages/relatorios.html">Relatórios</a>
            <a href="pages/investimentos.html">Investimentos</a>
            <a href="pages/perfil.html">Perfil</a>
        </nav>
    </aside>

    <main>
        <section class="resumo">
            <div class="card receitas">
                <h3>Receitas</h3>
                <p id="total-receitas">R$ 0,00</p>
            </div>

            <div class="card despesas">
                <h3>Despesas</h3>
                <p id="total-despesas">R$ 0,00</p>
            </div>

            <div class="card saldo">
                <h3>Saldo</h3>
                <p id="saldo-total">R$ 0,00</p>
            </div>

        </section>
        <section class = "formulario">
            <h2>Nova Transação</h2>
            <form id="form-transacao">
                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" placeholder="Ex: Almoço">
                </div>

                <div class="campo">
                    <label for="valor">Valor (RS)</label>
                    <input type="number" id="valor" placeholder="0,00" min="0" step="0.01">
                </div>

                <div class="campo">
                    <label for="Tipo"></label>
                    <select id="tipo">
                        <option value="despesa">Despesa</option>
                        <option value="receita">Receita</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria">
                        <option value="alimentacao">Alimentação</option>
                        <option value="transporte">Transporte</option>
                        <option value="lazer">Lazer</option>
                        <option value="saude">Saúde</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="data">Data</label>
                    <input type="date" id="data">
                </div>

                <button type="submit">Adicionar</button>

            </form>
        </section>

        <section class="lista">
            <h2>Transações</h2>
            <div class="filtros-barra">
                <select id="filtro-tipo">
                    <option value="">Todos os tipos</option>
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>
                <select id="filtro-categoria-filtro">
                    <option value="">Todas as categorias</option>
                </select>
                <input type="date" id="filtro-data-inicio" title="Data início">
                <input type="date" id="filtro-data-fim" title="Data fim">
                <button class="btn-limpar" id="btn-limpar-filtros">Limpar</button>
                <button class="btn-exportar" id="btn-exportar-csv">⬇ Exportar CSV</button>
            </div>
            <ul id="lista-transacoes"></ul>
        </section>
    </main>

    <script src="js/app.js" type="module"></script>
</body>
</html>
