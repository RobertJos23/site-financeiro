<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contas Fixas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <script>if(localStorage.getItem('tema')==='dark')document.body.classList.add('dark')</script>
    <div id="loading" class="loading-overlay"><div class="spinner"></div></div>

    <header class="topbar">
        <button id="btn-menu" class="btn-menu">&#9776;</button>
        <span class="topbar-titulo">Controle Financeiro</span>
        <div class="topbar-acoes">
            <button id="btn-tema">Modo Escuro</button>
            <button class="btn-logout" id="btn-logout">Sair</button>
        </div>
    </header>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">Controle Financeiro</span>
            <button id="btn-fechar-sidebar" class="btn-fechar-sidebar">&#10005;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="assistente.html">Assistente IA</a>
            <a href="../index.html">Transações</a>
            <a href="categorias.html">Categorias</a>
            <a href="contas.html">Contas</a>
            <a href="metas.html">Metas</a>
            <a href="relatorios.html">Relatórios</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </aside>

    <main>
        <section class="resumo">
            <div class="card">
                <h3>Total de Contas Fixas</h3>
                <p id="total-contas" style="color: #c0392b;">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Quantidade de Contas</h3>
                <p id="qtd-contas" style="color: #2c3e50;">0</p>
            </div>
        </section>

        <section class="formulario">
            <h2>Nova Conta Fixa</h2>
            <form id="form-conta">
                <div class="campo">
                    <label for="nome-conta">Nome</label>
                    <input type="text" id="nome-conta" placeholder="Ex: Netflix">
                </div>
                <div class="campo">
                    <label for="valor-conta">Valor (R$)</label>
                    <input type="number" id="valor-conta" placeholder="0,00" min="0" step="0.01">
                </div>
                <div class="campo">
                    <label for="dia-conta">Dia de Vencimento</label>
                    <input type="number" id="dia-conta" placeholder="Ex: 10" min="1" max="31">
                </div>
                <button type="submit">Adicionar</button>
            </form>
        </section>

        <section class="lista">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2>Contas Fixas</h2>
                <button id="btn-lancar">Lancar contas de <span id="mes-atual"></span></button>
            </div>
            <ul id="lista-contas"></ul>
        </section>
    </main>

    <script src="../js/contas.js" type="module"></script>
</body>
</html>
