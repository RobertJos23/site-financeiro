<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="loading" class="loading-overlay"><div class="spinner"></div></div>

    <header class="topbar">
        <button id="btn-menu" class="btn-menu">&#9776;</button>
        <span class="topbar-titulo">Controle Financeiro</span>
        <div class="topbar-acoes">
            <button id="btn-tema">Modo Escuro</button>
            <button class="btn-logout" id="btn-logout">Sair</button>
        </div>
    </header>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">Controle Financeiro</span>
            <button id="btn-fechar-sidebar" class="btn-fechar-sidebar">&#10005;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="assistente.html">Assistente IA</a>
            <a href="../index.html">Transações</a>
            <a href="categorias.html">Categorias</a>
            <a href="contas.html">Contas</a>
            <a href="metas.html">Metas</a>
            <a href="relatorios.html">Relatórios</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </aside>

    <main>
        <section class="filtro-relatorio">
            <h2>Relatórios</h2>
            <div class="filtro-campos">
                <div class="campo">
                    <label for="filtro-mes">Mês</label>
                    <select id="filtro-mes">
                        <option value="01">Janeiro</option>
                        <option value="02">Fevereiro</option>
                        <option value="03">Março</option>
                        <option value="04">Abril</option>
                        <option value="05">Maio</option>
                        <option value="06">Junho</option>
                        <option value="07">Julho</option>
                        <option value="08">Agosto</option>
                        <option value="09">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="filtro-ano">Ano</label>
                    <input type="number" id="filtro-ano" value="2025" min="2020" max="2099">
                </div>
            </div>
        </section>

        <section class="graficos-grid">
            <div class="grafico-card">
                <h3>Receitas vs Despesas</h3>
                <canvas id="grafico-receitas-despesas"></canvas>
            </div>
            <div class="grafico-card">
                <h3>Gastos por Categoria</h3>
                <canvas id="grafico-categorias"></canvas>
            </div>
            <div class="grafico-card grafico-largo">
                <h3>Progresso das Metas</h3>
                <canvas id="grafico-metas"></canvas>
            </div>
        </section>

        <section class="lista" style="max-width: 100%; margin-top: 32px;">
            <h2>Transações do Período</h2>
            <table id="tabela-transacoes">
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Tipo</th>
                        <th>Data</th>
                        <th>Valor</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela"></tbody>
            </table>
            <p id="msg-vazia" style="color: var(--label); margin-top: 12px; display: none;">Nenhuma transação neste periodo.</p>
        </section>
    </main>

    <script src="../js/relatorios.js" type="module"></script>
</body>
</html>
