<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investimentos</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <script>if(localStorage.getItem('tema')==='dark')document.body.classList.add('dark')</script>
    <div id="loading" class="loading-overlay"><div class="spinner"></div></div>

    <header class="topbar">
        <button id="btn-menu" class="btn-menu">&#9776;</button>
        <span class="topbar-titulo">Controle Financeiro</span>
        <div class="topbar-acoes">
            <button id="btn-tema">Modo Escuro</button>
            <button class="btn-logout" id="btn-logout">Sair</button>
        </div>
    </header>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">Controle Financeiro</span>
            <button id="btn-fechar-sidebar" class="btn-fechar-sidebar">&#10005;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="assistente.html">Assistente IA</a>
            <a href="../index.html">Transações</a>
            <a href="categorias.html">Categorias</a>
            <a href="contas.html">Contas</a>
            <a href="metas.html">Metas</a>
            <a href="relatorios.html">Relatórios</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </aside>

    <main>
        <section class="inv-controles">
            <div style="display: flex; align-items: center; gap: 16px;">
                <select id="select-moeda" class="inv-select">
                    <option value="">Selecione uma moeda...</option>
                </select>
                <button id="btn-adicionar-moeda">+ Adicionar</button>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <label style="font-size: 14px; color: var(--label);">Atualizar a cada:</label>
                <select id="intervalo-atualizacao" class="inv-select">
                    <option value="1">1 minuto</option>
                    <option value="5" selected>5 minutos</option>
                    <option value="10">10 minutos</option>
                    <option value="30">30 minutos</option>
                </select>
                <button id="btn-atualizar">&#8635; Atualizar</button>
            </div>
        </section>

        <p id="ultima-atualizacao" class="inv-timestamp"></p>

        <div id="painel-moedas" class="painel-moedas">
            <p style="color: var(--label);">Nenhuma moeda adicionada. Selecione acima para comecar.</p>
        </div>
    </main>

    <script src="../js/investimentos.js" type="module"></script>
</body>
</html>
