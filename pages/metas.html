<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <script>if(localStorage.getItem('tema')==='dark')document.body.classList.add('dark')</script>
    <div id="loading" class="loading-overlay"><div class="spinner"></div></div>

    <header class="topbar">
        <button id="btn-menu" class="btn-menu">&#9776;</button>
        <span class="topbar-titulo">Controle Financeiro</span>
        <div class="topbar-acoes">
            <button id="btn-tema">Modo Escuro</button>
            <button class="btn-logout" id="btn-logout">Sair</button>
        </div>
    </header>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">Controle Financeiro</span>
            <button id="btn-fechar-sidebar" class="btn-fechar-sidebar">&#10005;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="assistente.html">Assistente IA</a>
            <a href="../index.html">Transações</a>
            <a href="categorias.html">Categorias</a>
            <a href="contas.html">Contas</a>
            <a href="metas.html">Metas</a>
            <a href="relatorios.html">Relatórios</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </aside>

    <main>
        <section class="formulario">
            <h2>Nova Meta</h2>
            <form id="form-meta">
                <div class="campo">
                    <label for="nome-meta">Nome</label>
                    <input type="text" id="nome-meta" placeholder="Ex: Viagem para o nordeste">
                </div>
                <div class="campo">
                    <label for="valor-meta">Valor Alvo (R$)</label>
                    <input type="number" id="valor-meta" placeholder="0,00" min="0" step="0.01">
                </div>
                <button type="submit">Criar Meta</button>
            </form>
        </section>

        <section class="lista-metas">
            <h2>Minhas Metas</h2>
            <div id="lista-metas"></div>
        </section>
    </main>

    <script src="../js/metas.js" type="module"></script>
</body>
</html>
