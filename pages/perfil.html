<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="loading" class="loading-overlay"><div class="spinner"></div></div>

    <header class="topbar">
        <button id="btn-menu" class="btn-menu">&#9776;</button>
        <span class="topbar-titulo">Controle Financeiro</span>
        <div class="topbar-acoes">
            <button id="btn-tema">Modo Escuro</button>
            <button class="btn-logout" id="btn-logout">Sair</button>
        </div>
    </header>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo">Controle Financeiro</span>
            <button id="btn-fechar-sidebar" class="btn-fechar-sidebar">&#10005;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="assistente.html">Assistente IA</a>
            <a href="../index.html">Transações</a>
            <a href="categorias.html">Categorias</a>
            <a href="contas.html">Contas</a>
            <a href="metas.html">Metas</a>
            <a href="relatorios.html">Relatórios</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </aside>
    <main>
        <div class="perfil-card">
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="perfil-avatar" id="avatar"></div>
                <div class="perfil-info">
                    <div class="perfil-nome" id="nome-perfil"></div>
                    <div class="perfil-email" id="email-perfil"></div>
                    <span class="provider-badge" id="provider-badge"></span>
                </div>
            </div>

            <div class="perfil-secao">
                <h3>Alterar nome</h3>
                <form id="form-nome">
                    <div class="campo">
                        <label for="input-nome">Novo nome</label>
                        <input type="text" id="input-nome" placeholder="Seu nome">
                    </div>
                    <button type="submit">Salvar nome</button>
                </form>
            </div>

            <div class="perfil-secao" id="secao-senha">
                <h3>Alterar senha</h3>
                <form id="form-senha">
                    <div class="campo">
                        <label for="senha-atual">Senha atual</label>
                        <input type="password" id="senha-atual" placeholder="Senha atual">
                    </div>
                    <div class="campo">
                        <label for="nova-senha">Nova senha</label>
                        <input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres">
                    </div>
                    <button type="submit">Alterar senha</button>
                </form>
            </div>
        </div>
    </main>
    <script src="../js/perfil.js" type="module"></script>
</body>
</html>
